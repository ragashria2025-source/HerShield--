<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>HerShield — Verified Shops</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="app">
  <header class="topbar">
    <div class="brand-center">
      <div class="brand-title">HerShield <strong>AI+</strong></div>
      <div class="tagline">Made for women, By women</div>
    </div>
    <nav class="topnav"><a href="home.html">Home</a><a href="sos.html">SOS</a></nav>
    <div class="corner-time" id="headerTime">--:--</div>
  </header>

  <main class="container">
    <section class="card">
      <h2>Verified Shops</h2>
      <p class="muted">Tap a shop to view profile or call (mock).</p>

      <div id="shopsList" style="margin-top:12px"></div>
    </section>
  </main>

  <script src="main.js"></script>
  <script>
    startClock('headerTime');

    async function loadShops(){
      const shops = await fetch(window.HS_API + '/api/shops').then(r=>r.json()).catch(()=>[]);
      const el = document.getElementById('shopsList');
      if (!shops.length) return el.innerHTML = '<div class="muted">No shops available</div>';
      sessionStorage.setItem('hs_shops', JSON.stringify(shops));
      el.innerHTML = shops.map(s => `
        <div class="card mini" style="margin-bottom:10px;display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:700">${s.name} ${s.verified ? '✅' : ''}</div>
            <div class="muted">${s.address || ''}</div>
            <div class="muted">Contact: ${s.contact || '—'}</div>
          </div>
          <div style="text-align:right">
            <button class="btn" onclick="alert('Calling shop (mock)')">Call</button>
            <button class="btn" onclick="showShopProfile('${s.id}')">Profile</button>
          </div>
        </div>
      `).join('');
    }

    loadShops();
  </script>
</body>
</html>
